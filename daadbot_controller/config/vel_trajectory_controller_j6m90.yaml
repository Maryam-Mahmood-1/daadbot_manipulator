controller_manager:
  ros__parameters:
    update_rate: 100

    velocity_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    velocity_gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

velocity_arm_controller:
  ros__parameters:
    joints:
      - joint_1
      - joint_2
      - joint_3
      - joint_4
      - joint_5
      - joint_6
      - joint_7
    command_interfaces:
      - velocity
    state_interfaces:
      - position
      - velocity
    gains:
      joint_1: {p: 2.5, i: 1.5, d: 0.001, i_clamp: 0.0}
      joint_2: {p: 1.5, i: 0.1,  d: 0.001, i_clamp: 0.0, antiwindup: true}
      joint_3: {p: 1.5, i: 0.1,  d: 0.001, i_clamp: 0.0, antiwindup: true}
      joint_4: {p: 1.5, i: 0.1,  d: 0.001, i_clamp: 0.0, antiwindup: true}
      joint_5: {p: 2.5, i: 0.0,  d: 0.000, i_clamp: 0.0, antiwindup: true}
      joint_6: {p: 2.5, i: 0.0,  d: 0.000, i_clamp: 0.0, antiwindup: true}
      joint_7: {p: 2.5, i: 0.0,  d: 0.000, i_clamp: 0.0, antiwindup: true}
    open_loop_control: false
    constraints:
      stopped_velocity_tolerance: 0.001

velocity_gripper_controller:
  ros__parameters:
    joints:
      - gear1_joint
    command_interfaces:
      - velocity
    state_interfaces:
      - position
      - velocity
    gains:
      gear1_joint: {p: 1.5, i: 0.0, d: 0.0, angle_wraparound: true}
    open_loop_control: false
    allow_integration_in_goal_trajectories: true

joint_state_broadcaster:
  ros__parameters:
    update_rate: 100
    joints:
      - joint_1
      - joint_2
      - joint_3
      - joint_4
      - joint_5
      - joint_6
      - joint_7
      - gear1_joint
    interfaces:
      - position
      - velocity
      - effort
