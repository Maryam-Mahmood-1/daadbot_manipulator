controller_manager:
  ros__parameters:
    update_rate: 1000

    position_arm_controller:
      type: position_controllers/JointGroupPositionController

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

position_arm_controller:
  ros__parameters:
    joints:
      - joint_1
      - joint_2
      - joint_3

joint_state_broadcaster:
  ros__parameters:
    update_rate: 1000
    joints:
      - joint_1
      - joint_2
      - joint_3
    interfaces:
      - position
      - velocity
      - effort
